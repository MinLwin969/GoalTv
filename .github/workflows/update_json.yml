name: Update Live JSON

on:
  schedule:
    # UTC 09:30 မှ 22:30 ထိ (မြန်မာစံတော်ချိန် ညနေ 4:00 မှ မနက် 5:00 ထိ) - ၅ မိနစ်တစ်ကြိမ်
    - cron: '*/5 9-22 * * *'
  workflow_dispatch: # လက်စွဲဖြင့် (Manual) စမ်းသပ် Run လို့ရရန်

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        run: python main.py

      - name: Commit and Push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output.json
          git diff --staged --quiet || (git commit -m "Auto-update JSON data" && git push)
